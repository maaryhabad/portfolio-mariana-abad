<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio Pessoal e Currículo Online de Mariana Abad - Desenvolvedora Full-Stack & Software Engineer">
    <meta name="author" content="Mariana Abad">
    <title>Mariana Abad | Software Engineer & Portfolio</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Folha de Estilos em CSS3 Puro -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Barra Superior de Progresso de Rolagem -->
    <div class="scroll-progress-container" aria-hidden="true">
        <div id="scrollProgressBar" class="scroll-progress-bar"></div>
    </div>

    <!-- Cabeçalho Flutuante Fixo (Sticky Header com Glassmorphism) -->
    <header class="site-header" id="siteHeader">
        <div class="header-container">
            
            <!-- Identidade Visual / Logotipo -->
            <a href="#sobre-mim" class="brand-logo" aria-label="Ir para o topo - Mariana Abad">
                <div class="brand-icon" aria-hidden="true">MA</div>
                <div class="brand-text-wrapper">
                    <span class="brand-name">Mariana <span class="highlight">Abad</span></span>
                    <span class="brand-subtitle">Software Engineering</span>
                </div>
            </a>

            <!-- Menu de Navegação Semântico por Âncoras -->
            <nav class="nav-menu" id="navMenu" aria-label="Navegação Principal">
                <ul class="nav-list">
                    <li><a href="#sobre-mim" class="nav-link">Sobre Mim</a></li>
                    <li><a href="#formacao" class="nav-link">Formação</a></li>
                    <li><a href="#portfolio" class="nav-link">Portfólio</a></li>
                    <li><a href="#contato" class="nav-link">Contato</a></li>
                </ul>
            </nav>

            <!-- Ações do Cabeçalho e Indicador de Status -->
            <div class="header-actions">
                <div class="status-badge" title="Status Profissional">
                    <span class="status-dot-pulse" aria-hidden="true"></span>
                    <span>DISPONÍVEL</span>
                </div>
                
                <!-- Botão Menu Mobile (Hambúrguer) -->
                <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir Menu de Navegação" aria-expanded="false" aria-controls="navMenu">
                    ☰
                </button>
            </div>

        </div>
    </header>

    <!-- Conteúdo Principal - Single Page com 4 Seções Semânticas -->
    <main class="main-content" id="mainContent">

        <!-- Seção 1: Sobre Mim (Estrutura a ser detalhada no Passo 3) -->
        <section id="sobre-mim" class="section-container">
            <!-- Conteúdo construído no Passo 3 -->
        </section>

        <!-- Seção 2: Formação (Estrutura a ser detalhada no Passo 4) -->
        <section id="formacao" class="section-container">
            <!-- Conteúdo construído no Passo 4 -->
        </section>

        <!-- Seção 3: Portfólio (Estrutura a ser detalhada nos Passos 5 a 8) -->
        <section id="portfolio" class="section-container">
            <!-- Conteúdo construído nos Passos 5-8 -->
        </section>

        <!-- Seção 4: Contato (Estrutura a ser detalhada nos Passos 9 e 10) -->
        <section id="contato" class="section-container">
            <!-- Conteúdo construído nos Passos 9-10 -->
        </section>

    </main>

    <!-- Rodapé Semântico -->
    <footer class="site-footer">
        <!-- Estrutura do rodapé -->
    </footer>

    <!-- Scripts em Vanilla JS -->
    <script src="js/script.js"></script>
</body>
</html>
